    name: ConditionStatusEnum
    definition_uri: https://w3id.org/bdc/varlib/ConditionStatusEnum
    description: The status vocabulary real value_mappings target consistently across
      the repo's Condition/DrugExposure derivations.
    from_schema: https://w3id.org/bdc/varlib/common
    permissible_values:
      ABSENT:
        text: ABSENT
        description: Condition/exposure reported absent.
      PRESENT:
        text: PRESENT
        description: Condition/exposure reported present.
      HISTORICAL:
        text: HISTORICAL
