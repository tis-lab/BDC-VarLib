---
id: https://w3id.org/linkml/bdc-variable-library
name: bdc-variable-library
title: bdc-variable-library
description: |-
  LinkML models for variables in the BDC Knowledge Library
license: BSD-3-Clause
see_also:
  - https://linkml.github.io/bdc-variable-library

prefixes:
  bdc_variable_library: https://w3id.org/linkml/bdc-variable-library/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: http://www.example.org/rdf#
  bdchm: https://w3id.org/bdchm/
  OMOP: https://athena.ohdsi.org/search-terms/terms/
  OBA: http://purl.obolibrary.org/obo/OBA_
  LOINC: https://loinc.org/
  UCUM: https://units-of-measurement.org/
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  MMO: http://purl.obolibrary.org/obo/MMO_
  RxNorm: http://purl.bioontology.org/ontology/RXNORM/
  ISO11179: http://purl.org/iso11179/
default_prefix: bdc_variable_library
default_range: string

imports:
  - linkml:types
  - linkml_microschema_profile
  - clinical_microschemas

classes:

  Entity:
    abstract: true
    description: >-
      Any resource that has its own identifier
    class_uri: schema:Thing
    slots:
      - id

  Variable:
    is_a: Entity
    description: >-
      A generic grouping for any variable
    slots:
      - associated_study
      - variable_description
      - concept_type
      - variable_label

  SingleContinuousVariable:
    is_a: Variable
    description: >-
      Represents a single entry in a data dictionary of a variable with a continuous
      value
    slots:
      - source_id
      - file_id
      - file_name
      - variable_name
      - source_variable_description
      - data_type
      - minimum_value
      - maximum_value
      - resolution
      - missing_value
      - unit
      - alert_values
      - comment

  SingleCategoricalVariable:
    is_a: Variable
    description: >-
      Represents a single entry in a data dictionary of a variable with a categorical
      value
    slots:
      - source_id
      - file_id
      - file_name
      - variable_name
      - source_variable_description
      - data_type
      - missing_value
      - coded_values
      - comment

  CompoundVariable:
    is_a: Variable
    description: >-
      Represents a variable and all metadata
    slots:
     - cde_id
     - bdchm_type
     - unit
     - row_metadata
     - documentation_metadata
     - alert_value
     
  IntegratedVariable:
    is_a: Variable
    description: >-
      Represents a variable that contains data from multiple studies. Typically,
      some or all of the data must undergo a transformation in order to be
      successfully integrated
    slots:
      - cde_id
      - bdchm_type
      - unit
      - integrates

  MissingValue:
    description: >-
      Character used to indicate a missing value in a data set
    slots:
      - indicator_char
      - indicator_meaning

  AlertValue:
    description: >-
      Character used to add information to a datum
    slots:
      - indicator_char
      - indicator_meaning

  EnumValue:
    description: >-
      One possible answer in a list of enumerated values
    slots:
      - indicator_char
      - indicator_meaning
      - indicator_type
      
  MetadataVariable:
    is_a: Entity
    description: >-
      Specific data point used to add information to an observation. This will
      typically be a unique identifier for a SingleVariable and a slot from a 
      microschema
    slots:
      - microschema_slot

  DocumentationVariable:
    description: >-
      Information derived from study documentation or text in a data dictionary
      that provides essential metadata for a variable
    slots:
      - contr_vocab
      - microschema_slot
    rules:
      - preconditions:
          slot_conditions:
            microschema_slot:
              equals_string: instrument
        postconditions:
          slot_conditions:
            contr_vocab:
              range: InstrumentEnum
      - preconditions:
          slot_conditions:
            microschema_slot:
              equals_string: method
        postconditions:
          slot_conditions:
            contr_vocab:
              range: MethodEnum
      - preconditions:
          slot_conditions:
            microschema_slot:
              equals_string: condition_type
        postconditions:
          slot_conditions:
            contr_vocab:
              any_of:
                - pattern: "^MONDO:\\d{7}$"
                - pattern: "^HP:\\d{7}$"
      - preconditions:
          slot_conditions:
            microschema_slot:
              equals_string: condition_provenance
        postconditions:
          slot_conditions:
            contr_vocab:
              range: ProvenanceEnum
  
